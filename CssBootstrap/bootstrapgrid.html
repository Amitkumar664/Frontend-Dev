<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">

    <h1 class="text-center my-3">Bootstrap Grid</h1>

    <div class="row text-center">
        <div class="col border border-dark p-3 bg-success text-white">Column 1</div>
        <div class="col border border-dark p-3 bg-warning">Column 2</div>
        <div class="col border border-dark p-3 bg-danger text-white">Column 3</div>
    </div>

    <div class="row text-center">
        <div class="col border border-dark p-3 bg-success text-white">Column 4</div>
        <div class="col border border-dark p-3 bg-warning">Column 5</div>
        <div class="col border border-dark p-3 bg-danger text-white">Column 6</div>
    </div>

    <div class="row text-center">
        <div class="col border border-dark p-3 bg-success text-white">Column 7</div>
        <div class="col border border-dark p-3 bg-warning">Column 8</div>
        <div class="col border border-dark p-3 bg-danger text-white">Column 9</div>
    </div>

</body>
</html>

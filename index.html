<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Result Manager</h1>

<!-- Form to add or edit student -->
<form id="studentForm">
    <input type="hidden" id="hiddenId">
    <input type="text" id="studentName" placeholder="Full Name" required>
    <input type="text" id="studentSection" placeholder="Section" required>
    <input type="number" id="marksMath" placeholder="Math" min="0" max="100" required>
    <input type="number" id="marksScience" placeholder="Science" min="0" max="100" required>
    <input type="number" id="marksEnglish" placeholder="English" min="0" max="100" required>
    <button type="submit">Save Student</button>
</form>

<!-- Success/Error messages -->
<div id="messageBox"></div>

<hr>

<!-- Student list table -->
<table id="studentsTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Section</th>
            <th>Math</th>
            <th>Science</th>
            <th>English</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="student.js"></script>
<script src="script.js"></script>

</body>
</html>

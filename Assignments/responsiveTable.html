<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="style.css">
  <style>
    h1 {
    background-color: yellowgreen;
    text-align: center;
    margin-bottom: 20px;
    }

    table {
    width: 100%;
    border-collapse: collapse;
    }

    th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
    }

    th {
    background: #f2f2f2;
    }

    /* Responsive part */
    @media (max-width: 768px) {
    table, thead, tbody, th, td, tr {
        display: block;
    }

    thead {
        display: none;
    }

    tr {
        margin-bottom: 15px;
        border: 1px solid #ccc;
        padding: 10px;
    }

    td {
        border: none;
        display: block;
        padding: 5px 0;
    }

    td::before {
        content: attr(data-label) ": ";
        font-weight: bold;
        display: inline-block;
    }
    }

  </style>
</head>
<body>

  <h1>Responsive CSS Cheat Sheet</h1>

  <table>
    <thead>
      <tr>
        <th>Property</th>
        <th>Description</th>
        <th>Example</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="Property">blur()</td>
        <td data-label="Description">Applies a blur effect</td>
        <td data-label="Example">filter: blur(5px);</td>
      </tr>
      <tr>
        <td data-label="Property">brightness()</td>
        <td data-label="Description">Adjust brightness</td>
        <td data-label="Example">filter: brightness(2);</td>
      </tr>
      <tr>
        <td data-label="Property">contrast()</td>
        <td data-label="Description">Adjust contrast</td>
        <td data-label="Example">filter: contrast(150%);</td>
      </tr>
    </tbody>
  </table>

</body>
</html>

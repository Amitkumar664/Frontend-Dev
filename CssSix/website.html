<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpage</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: lightblue;
            font-size: 27px;
            font-weight: bold;
        }
        nav{
            background-color: rgb(16, 0, 0);
            padding: 10px 5px 10px 5px;
        }
        nav a{
            
            color: white;
            text-decoration: none;
            font-size: 20px;
            margin: 0 10px 0 10px;
            border-right: 1px solid white;
        }
        nav a:last-child{
            border-right: none;
        }
        section{
            display: inline-block;
        }
        aside{
            display: inline-block;
            background-color: lightblue;
            width: 30%;
        }

    </style>
</head>
<body>
    <header>
        Site Name
    </header>
    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Services</a> |
        <a href="#">Contact</a>
    </nav>
    <main>
        <section>
            <h1>content heading </h1>
            <!-- <p>This is a sample webpage created to demonstrate basic HTML structure and styling using CSS.</p> -->
        </section>
        <aside>
            <h1>Aside heading</h1>
        </aside>
    </main>
    <footer></footer>
    
    
</body>
</html>
